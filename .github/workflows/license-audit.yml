name: License audit

on:
  schedule:
    # 08:00 UTC Mondays — 09:00 Dublin in summer, 08:00 in winter.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The default GITHUB_TOKEN is scoped to this repository only and cannot
      # enumerate the org's private repos. The org-wide CI app can, and its
      # token is minted per run rather than stored and rotated by hand.
      - name: Mint an org-scoped token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run audit
        id: audit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          set +e
          ./scripts/license-audit.sh > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update tracking issue
        if: steps.audit.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="License audit: repositories need attention"
          printf '%s\n\n---\n\n_Generated by [License audit](%s). Closes automatically once every repository is compliant._\n' \
            "$(cat report.md)" "$RUN_URL" > body.md

          EXISTING=$(gh issue list --repo "$REPO" --state open \
                      --search "$TITLE in:title" --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$REPO" --body-file body.md
            echo "Updated issue #$EXISTING"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file body.md \
              --label compliance 2>/dev/null \
              || gh issue create --repo "$REPO" --title "$TITLE" --body-file body.md
          fi

      - name: Close tracking issue when clean
        if: steps.audit.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="License audit: repositories need attention"
          EXISTING=$(gh issue list --repo "$REPO" --state open \
                      --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$REPO" \
              --comment "All repositories now carry the canonical Apache-2.0 license."
            echo "Closed issue #$EXISTING"
          fi

      - name: Fail the run if drift was found
        if: steps.audit.outputs.status != '0'
        run: exit 1
