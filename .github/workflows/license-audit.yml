name: License audit

on:
  schedule:
    # 08:00 UTC Mondays — 09:00 Dublin in summer, 08:00 in winter.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run audit
        id: audit
        env:
          # The default GITHUB_TOKEN is scoped to this repository only and
          # cannot enumerate the org's private repos. ORG_AUDIT_TOKEN must be
          # a PAT (or App token) with read access to all repositories.
          GH_TOKEN: ${{ secrets.ORG_AUDIT_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::ORG_AUDIT_TOKEN is not set. Create a PAT with read access" \
                 "to all org repositories and add it as an Actions secret."
            exit 1
          fi
          set +e
          ./scripts/license-audit.sh > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update tracking issue
        if: steps.audit.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="License audit: repositories need attention"
          printf '%s\n\n---\n\n_Generated by [License audit](%s). Closes automatically once every repository is compliant._\n' \
            "$(cat report.md)" "$RUN_URL" > body.md

          EXISTING=$(gh issue list --repo "$REPO" --state open \
                      --search "$TITLE in:title" --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$REPO" --body-file body.md
            echo "Updated issue #$EXISTING"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file body.md \
              --label compliance 2>/dev/null \
              || gh issue create --repo "$REPO" --title "$TITLE" --body-file body.md
          fi

      - name: Close tracking issue when clean
        if: steps.audit.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="License audit: repositories need attention"
          EXISTING=$(gh issue list --repo "$REPO" --state open \
                      --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$REPO" \
              --comment "All repositories now carry the canonical Apache-2.0 license."
            echo "Closed issue #$EXISTING"
          fi

      - name: Fail the run if drift was found
        if: steps.audit.outputs.status != '0'
        run: exit 1
